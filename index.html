<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Indie Artist Radar - Showcase Rilisan Musik</title>
  
  <style>
    /* RESET & BASE STYLES */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
    body { background-color: #0b0c10; color: #c5c6c7; padding: 20px; line-height: 1.5; }
    .container { max-width: 1200px; margin: 0 auto; }

    /* HEADER */
    header { text-align: center; margin-bottom: 35px; }
    header h1 { font-size: 2.2rem; color: #66fcf1; text-transform: uppercase; letter-spacing: 2px; }
    header p { color: #8892b0; font-size: 0.95rem; margin-top: 5px; }

    /* FORM CARD SECTION */
    .form-card { background: #1f2833; padding: 25px; border-radius: 12px; border: 1px solid #45a29e44; margin-bottom: 40px; }
    .form-card h2 { margin-bottom: 20px; font-size: 1.2rem; color: #45a29e; display: flex; align-items: center; gap: 8px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.85rem; color: #c5c6c7; margin-bottom: 6px; font-weight: 600; }
    .form-group input { width: 100%; padding: 10px 14px; background: #0b0c10; border: 1px solid #45a29e44; color: #fff; border-radius: 6px; font-size: 0.9rem; }
    .form-group input:focus { outline: none; border-color: #66fcf1; }
    .grid-inputs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 15px; }
    
    button.btn-submit { background: linear-gradient(135deg, #45a29e, #66fcf1); border: none; color: #0b0c10; padding: 12px 20px; border-radius: 6px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; font-size: 1rem; text-transform: uppercase; transition: opacity 0.2s; }
    button.btn-submit:hover { opacity: 0.9; }

    /* SHOWCASE GRID SECTION */
    .section-title { font-size: 1.4rem; color: #fff; margin-bottom: 20px; border-left: 4px solid #66fcf1; padding-left: 10px; }
    .artists-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
    
    /* ARTIST CARD DESIGN */
    .artist-card { background: #1f2833; border: 1px solid #2e3c4d; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, border-color 0.2s; }
    .artist-card:hover { transform: translateY(-5px); border-color: #66fcf1; }
    
    /* COVER IMAGE FROM YOUTUBE */
    .cover-wrapper { width: 100%; height: 180px; background: #0b0c10; position: relative; overflow: hidden; }
    .cover-wrapper img { width: 100%; height: 100%; object-fit: cover; }
    
    .card-body { padding: 18px; display: flex; flex-direction: column; flex-grow: 1; }
    .artist-name { font-size: 1.25rem; font-weight: 700; color: #fff; margin-bottom: 4px; }
    .artist-genre { align-self: flex-start; background: #45a29e22; color: #66fcf1; font-size: 0.75rem; padding: 3px 10px; border-radius: 20px; font-weight: 600; margin-bottom: 16px; border: 1px solid #45a29e44; }
    
    /* PLATFORM STREAMING BUTTONS */
    .platform-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: auto; }
    .btn-link { text-decoration: none; padding: 6px 12px; font-size: 0.78rem; border-radius: 6px; font-weight: 700; color: #fff; transition: filter 0.2s; }
    .btn-link:hover { filter: brightness(1.2); }
    
    /* PLATFORM COLORS */
    .spotify { background: #1DB954; }
    .ytmusic { background: #FF0000; }
    .soundcloud { background: #FF5500; }
    .audiomack { background: #FFA200; color: #000; }
    .amazon { background: #00A8E1; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Indie Artist Radar</h1>
    <p>Pusat Rujukan & Link Streaming Resmi Artis Indie</p>
  </header>

  <!-- FORM SUBMISSION -->
  <div class="form-card">
    <h2>Submit Track / Profil Artis</h2>
    <form id="artistForm">
      <div class="grid-inputs">
        <div class="form-group">
          <label>Nama Artis / Project *</label>
          <input type="text" id="namaArtis" placeholder="Contoh: ABLEZ" required>
        </div>
        <div class="form-group">
          <label>Genre Musik *</label>
          <input type="text" id="genre" placeholder="Contoh: Hard Rock / Metal 70s" required>
        </div>
      </div>

      <div class="form-group">
        <label>Link Video YouTube Utama (Diambil Cover-nya) *</label>
        <input type="url" id="linkYTVideo" placeholder="https://www.youtube.com/watch?v=... atau https://youtu.be/..." required>
      </div>

      <div class="grid-inputs">
        <div class="form-group">
          <label>Link Spotify (Opsional)</label>
          <input type="url" id="linkSpotify" placeholder="https://open.spotify.com/artist/...">
        </div>
        <div class="form-group">
          <label>Link YouTube Music (Opsional)</label>
          <input type="url" id="linkYTMusic" placeholder="https://music.youtube.com/...">
        </div>
      </div>

      <div class="grid-inputs">
        <div class="form-group">
          <label>Link SoundCloud (Opsional)</label>
          <input type="url" id="linkSoundcloud" placeholder="https://soundcloud.com/...">
        </div>
        <div class="form-group">
          <label>Link Audiomack (Opsional)</label>
          <input type="url" id="linkAudiomack" placeholder="https://audiomack.com/...">
        </div>
        <div class="form-group">
          <label>Link Amazon Music (Opsional)</label>
          <input type="url" id="linkAmazon" placeholder="https://music.amazon.com/...">
        </div>
      </div>

      <button type="submit" class="btn-submit">Publish Ke Radar</button>
    </form>
  </div>

  <!-- KATALOG ARTIS -->
  <h2 class="section-title">Katalog Artis Terbaru</h2>
  <div class="artists-grid" id="artistsContainer">
    <!-- Card dari Firestore akan di-render di sini -->
  </div>
</div>

<!-- SDK FIRESTORE VIA CDN (MODULAR V10) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 1. CONFIG FIRESTORE (Ganti dengan kunci proyek Firebase milikmu)
  const firebaseConfig = {
    apiKey: "AIzaSyYOUR_API_KEY_HERE",
    authDomain: "your-project-id.firebaseapp.com",
    projectId: "your-project-id",
    storageBucket: "your-project-id.appspot.com",
    messagingSenderId: "1234567890",
    appId: "1:1234567890:web:abcdef123456"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // FUNGSI EKSTRAKSI YOUTUBE VIDEO ID DARI URL
  function getYouTubeId(url) {
    const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
    const match = url.match(regExp);
    return (match && match[2].length === 11) ? match[2] : null;
  }

  // 2. PROSES SUBMIT FORM KE FIRESTORE
  const artistForm = document.getElementById('artistForm');
  artistForm.addEventListener('submit', async (e) => {
    e.preventDefault();

    const rawYTUrl = document.getElementById('linkYTVideo').value;
    const ytId = getYouTubeId(rawYTUrl);

    if (!ytId) {
      alert("Link Video YouTube tidak valid! Pastikan format link sesuai.");
      return;
    }

    const newArtist = {
      nama: document.getElementById('namaArtis').value,
      genre: document.getElementById('genre').value,
      yt_id: ytId,
      links: {
        spotify: document.getElementById('linkSpotify').value.trim(),
        ytmusic: document.getElementById('linkYTMusic').value.trim(),
        soundcloud: document.getElementById('linkSoundcloud').value.trim(),
        audiomack: document.getElementById('linkAudiomack').value.trim(),
        amazon: document.getElementById('linkAmazon').value.trim()
      },
      createdAt: new Date()
    };

    try {
      await addDoc(collection(db, "artists"), newArtist);
      alert("Profil Artis Berhasil Ditambahkan!");
      artistForm.reset();
    } catch (err) {
      console.error("Gagal menyimpan data: ", err);
      alert("Terjadi kesalahan saat menyimpan data.");
    }
  });

  // 3. READ DATA FIRESTORE SECARA REAL-TIME & RENDER DYNAMIC CARD
  const container = document.getElementById('artistsContainer');
  const q = query(collection(db, "artists"), orderBy("createdAt", "desc"));

  onSnapshot(q, (snapshot) => {
    container.innerHTML = ""; // Bersihkan kontainer sebelum merender ulang

    snapshot.forEach((doc) => {
      const data = doc.data();
      const links = data.links || {};
      
      // URL Gambar Cover otomatis dari YouTube
      const coverUrl = `https://img.youtube.com/vi/${data.yt_id}/hqdefault.jpg`;
      const fallbackImage = `https://via.placeholder.com/400x225/0b0c10/66fcf1?text=No+Cover`;

      const card = document.createElement('div');
      card.className = 'artist-card';

      let cardHTML = `
        <div class="cover-wrapper">
          <img src="${coverUrl}" onerror="this.src='${fallbackImage}'" alt="Cover ${data.nama}">
        </div>
        <div class="card-body">
          <div class="artist-name">${data.nama}</div>
          <div class="artist-genre">${data.genre}</div>
          <div class="platform-links">
      `;

      // HANYA RENDER TOMBOL JIKA LINK DIISI USER
      if (links.spotify) cardHTML += `<a href="${links.spotify}" target="_blank" class="btn-link spotify">Spotify</a>`;
      if (links.ytmusic) cardHTML += `<a href="${links.ytmusic}" target="_blank" class="btn-link ytmusic">YT Music</a>`;
      if (links.soundcloud) cardHTML += `<a href="${links.soundcloud}" target="_blank" class="btn-link soundcloud">SoundCloud</a>`;
      if (links.audiomack) cardHTML += `<a href="${links.audiomack}" target="_blank" class="btn-link audiomack">Audiomack</a>`;
      if (links.amazon) cardHTML += `<a href="${links.amazon}" target="_blank" class="btn-link amazon">Amazon</a>`;

      cardHTML += `
          </div>
        </div>
      `;

      card.innerHTML = cardHTML;
      container.appendChild(card);
    });
  });
</script>

</body>
</html>
